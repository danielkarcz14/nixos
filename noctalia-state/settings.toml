config_version = 14

[bar.default]
background_opacity = 0.84999998100101948
center = [ "clock", "weather", "media" ]
end = [
    "cpu",
    "ram",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "JetBrains Mono"
margin_edge = 5
margin_ends = 300
start = [ "workspaces" ]
thickness = 30
widget_spacing = 10

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 128.0
    box_width = 448.0
    cx = 1720.0
    cy = 1296.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.0
        clock_style = "digital"
        font_family = "JetBrains Mono"
        format = "{:%H:%M:%S}"
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 64.0
    box_width = 704.0
    cx = 1720.0
    cy = 1200.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        background_opacity = 0.0
        font_family = "JetBrains Mono"
        format = "%A, %d %B %Y"
        shadow = false

[dock]
auto_hide = true
background_opacity = 0.79999998211860657
enabled = true
icon_size = 30
launcher_position = "start"
magnification_scale = 1.3000000044703484
main_axis_padding = 15
pinned = [ "spotify", "firefox", "pcmanfm", "slack", "teams-for-linux", "chrome-faolnafnngnfdaknnbpnkhgohbobgegn-Default" ]
reserve_space = false
shadow = false
show_running = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

